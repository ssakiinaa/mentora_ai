{% extends 'base.html' %}
{% block title %}New Journal Entry - Mentora AI{% endblock %}

{% block content %}
<div class="min-h-screen max-w-3xl mx-auto">
  <h1 class="text-3xl font-bold text-[var(--text-primary)] mb-6 flex items-center gap-3">
    <svg class="w-8 h-8 text-[var(--accent-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
    </svg>
    New Journal Entry
  </h1>

  <form method="post" class="bg-[var(--bg-card)] rounded-xl shadow-lg p-6 border border-[var(--border-color)]">
    {% csrf_token %}
    <div class="mb-6">
      <label for="entry_text" class="block text-sm font-medium text-[var(--text-primary)] mb-2">
        What's on your mind today?
      </label>
      <textarea 
        id="entry_text" 
        name="entry_text" 
        rows="12" 
        required
        class="w-full bg-[var(--bg-secondary)] text-[var(--text-primary)] rounded-lg p-4 border border-[var(--border-color)] focus:border-[var(--accent-primary)] focus:ring-2 focus:ring-[var(--accent-primary)] focus:outline-none"
        placeholder="Write about your day, thoughts, feelings, achievements, or anything you'd like to reflect on..."
      ></textarea>
      <p class="text-xs text-[var(--text-muted)] mt-2 flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
        </svg>
        AI will generate a reflection summary after you save.
      </p>
    </div>

    <div class="flex gap-4">
      <button type="submit" class="bg-[var(--accent-primary)] hover:opacity-90 text-white px-6 py-3 rounded-lg transition font-medium">
        Save Entry
      </button>
      <a href="{% url 'journal_list' %}" class="bg-[var(--hover-bg)] hover:opacity-80 text-[var(--text-primary)] px-6 py-3 rounded-lg transition">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
