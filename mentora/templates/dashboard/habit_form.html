{% extends 'base.html' %}
{% block title %}New Habit - Mentora AI{% endblock %}

{% block content %}
<div class="min-h-screen max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold text-[var(--text-primary)] mb-6 flex items-center gap-3">
    <svg class="w-8 h-8 text-[var(--accent-positive)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
    </svg>
    New Habit
  </h1>

  <form method="post" class="bg-[var(--bg-card)] rounded-xl shadow-lg p-6 border border-[var(--border-color)]">
    {% csrf_token %}
    <div class="mb-6">
      <label for="name" class="block text-sm font-medium text-[var(--text-primary)] mb-2">
        Habit Name *
      </label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        required
        class="w-full bg-[var(--bg-secondary)] text-[var(--text-primary)] rounded-lg p-3 border border-[var(--border-color)] focus:border-[var(--accent-positive)] focus:ring-2 focus:ring-[var(--accent-positive)] focus:outline-none"
        placeholder="e.g., Morning Meditation, Daily Reading"
      />
    </div>

    <div class="mb-6">
      <label for="description" class="block text-sm font-medium text-[var(--text-primary)] mb-2">
        Description (optional)
      </label>
      <textarea 
        id="description" 
        name="description" 
        rows="4"
        class="w-full bg-[var(--bg-secondary)] text-[var(--text-primary)] rounded-lg p-3 border border-[var(--border-color)] focus:border-[var(--accent-positive)] focus:ring-2 focus:ring-[var(--accent-positive)] focus:outline-none"
        placeholder="Add details about your habit..."
      ></textarea>
    </div>

    <div class="flex gap-4">
      <button type="submit" class="bg-[var(--accent-positive)] hover:opacity-90 text-white px-6 py-3 rounded-lg transition font-medium">
        Create Habit
      </button>
      <a href="{% url 'habit_list' %}" class="bg-[var(--hover-bg)] hover:opacity-80 text-[var(--text-primary)] px-6 py-3 rounded-lg transition">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
